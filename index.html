<!DOCTYPE html>
<html lang="en" class="notranslate" translate="no">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SECURE EXAM SUPABASE 800 READY</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@400;600&display=swap');
body{font-family:'Inter',sans-serif;background:#0a0a0a;user-select:none;}
.font-racing{font-family:'Oswald',sans-serif;}
.option-card:has(input:checked){border-color:#f59e0b;background:#f59e0b15;}
.watermark{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5;opacity:0.04;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(10,1fr);font-size:12px;color:white;font-weight:900;transform:rotate(-20deg);}
.watermark span{padding:40px;white-space:nowrap;}
</style>
</head>
<body class="text-zinc-200 min-h-screen flex flex-col">
<div id="watermark" class="watermark"></div>
<div class="h-1.5 w-full bg-gradient-to-r from-emerald-600 via-amber-500 to-emerald-600"></div>
<div class="bg-emerald-600 text-white text-[10px] font-black px-4 py-1.5 flex justify-between uppercase">
<div><i class="fa-solid fa-database"></i> SUPABASE 800 READY - SG</div>
<div><span id="violationCount">VIOLATIONS: 0/3</span></div>
</div>
<header class="bg-black border-b-2 border-amber-500/50 p-3 sticky top-0 z-40">
<div class="max-w-4xl mx-auto flex justify-between items-center">
<div class="flex items-center gap-3"><img src="https://cdn.jsdelivr.net/gh/fikri81/handbook_TKR@main/logob.png" class="w-10 h-10 bg-white rounded-xl p-1"><div><h1 class="font-racing font-black text-sm uppercase">SUPABASE EXAM <span class="text-emerald-400">800</span></h1><p class="text-[9px] text-zinc-500">Click Image to Zoom</p></div></div>
<div class="text-right"><p class="text-[9px] text-zinc-500 font-black">TIME</p><p class="text-xl font-black font-racing text-amber-500" id="timer">45:00</p></div>
</div>
</header>
<div id="fsPrompt" class="fixed inset-0 bg-black/95 z-[200] flex items-center justify-center p-4">
<div class="bg-zinc-900 border-2 border-emerald-500 rounded-2xl p-8 max-w-md w-full text-center">
<i class="fa-solid fa-graduation-cap text-5xl text-emerald-400 mb-4"></i>
<h2 class="text-xl font-black font-racing uppercase">UJIAN ESP OTOMOTIF</h2>
<div class="mt-6 bg-black border border-zinc-800 rounded-lg p-3 text-left space-y-2">
<input id="fsName" placeholder="Nama Lengkap" class="w-full bg-zinc-900 border border-zinc-700 rounded px-3 py-2.5 text-sm outline-none">
<input id="fsClass" placeholder="Kelas (ex: X TKR 1)" class="w-full bg-zinc-900 border border-zinc-700 rounded px-3 py-2.5 text-sm outline-none">
<input id="fsAbsen" placeholder="No Absen" class="w-full bg-zinc-900 border border-zinc-700 rounded px-3 py-2.5 text-sm outline-none">
</div>
<button onclick="startSecureExam()" class="w-full mt-4 bg-gradient-to-r from-emerald-500 to-green-600 text-black font-black py-3.5 rounded-xl uppercase font-racing">MULAI - FULLSCREEN</button>
</div>
</div>
<div id="secureOverlay" class="hidden fixed inset-0 bg-black/80 z-[150] flex items-center justify-center p-4"><div class="bg-red-900/90 border-2 border-red-500 rounded-2xl p-8 max-w-sm w-full text-center"><h2 class="text-lg font-black font-racing uppercase text-white" id="overlayTitle">CHEATING!</h2><p class="text-sm text-red-200 mt-2" id="overlayMsg"></p><button onclick="resumeExam()" class="mt-6 bg-white text-black font-black px-6 py-2.5 rounded-xl text-xs uppercase w-full">KEMBALI</button></div></div>
<div id="imgZoom" class="hidden fixed inset-0 bg-black/90 z-[300] flex items-center justify-center p-4" onclick="this.classList.add('hidden')"><img id="zoomedImg" src="" class="max-w-[90%] max-h-[90%] bg-white rounded-2xl p-2"></div>
<main class="max-w-4xl mx-auto w-full p-3 flex-grow relative z-10">
<div class="bg-zinc-900/80 border border-zinc-800 rounded-xl p-3 mb-4 flex justify-between"><div class="flex-1 mr-4"><div class="flex justify-between text-[10px] font-black uppercase mb-1"><span>PROGRESS</span><span id="progressText">0/35</span></div><div class="w-full bg-black rounded-full h-2"><div id="progressBar" class="bg-gradient-to-r from-emerald-500 to-green-600 h-2 rounded-full" style="width:0%"></div></div></div><div class="text-[9px] text-zinc-500 font-bold">ID: <span id="examId" class="text-emerald-400">-</span></div></div>
<form id="examForm"><div id="pgContainer" class="space-y-4"></div><div class="mt-8 bg-gradient-to-br from-zinc-900 to-black border-2 border-emerald-500/20 rounded-xl p-4"><h3 class="font-racing font-black uppercase text-emerald-400 mb-4 text-sm">ESSAY 5 QUESTIONS</h3><div id="essayContainer" class="space-y-4"></div></div><div class="mt-6"><button type="button" onclick="submitExam()" class="w-full bg-gradient-to-r from-emerald-500 to-green-600 text-black font-black py-4 rounded-xl uppercase font-racing text-sm">SUBMIT FINAL</button></div></form>
</main>
<div id="resultModal" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center z-[200] p-4"><div class="bg-zinc-900 border-2 border-green-500 rounded-2xl p-6 max-w-lg w-full"><div class="text-center"><i class="fa-solid fa-circle-check text-5xl text-green-500 mb-3"></i><h2 class="font-black font-racing uppercase text-xl">SUBMITTED!</h2></div><div id="finalResult" class="mt-4"></div><div id="sheetStatus" class="mt-4 text-center text-xs bg-black border border-zinc-800 rounded-lg p-3"></div><button onclick="location.reload()" class="w-full mt-4 bg-zinc-800 text-white font-bold py-3 rounded-xl">CLOSE</button></div></div>
<script>
const CDN="https://cdn.jsdelivr.net/gh/fikri81/handbook_TKR@main/";
const SUPABASE_URL="https://rrwehnexvwsjiczrmbic.supabase.co";
const SUPABASE_KEY="sb_publishable_SkFN8xg7I7DW59x6aX8dlw_4QYEGE44";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let violations=0;let studentInfo={};let examStarted=false;
const examData=[{id:1,cat:"TOOLS",q:"What is the function of 'Combination Wrench'?",img:"combination_wrench.jpg",options:["Used to tighten or loosen bolts and nuts with dual ends","Used to measure voltage","Used to lift heavy vehicles","Used to store rotational energy","Used to cool engine coolant"],answer:0},{id:2,cat:"TOOLS",q:"Which tool is used to apply a specific torque value?",img:"torque_wrench.jpg",options:["Feeler Gauge","Torque Wrench","Hydraulic Jack","Socket Wrench","Multimeter"],answer:1},{id:3,cat:"TOOLS",q:"'Vernier Caliper' is used for?",img:"vernier_caliper.jpg",options:["To support vehicle safely","To measure internal, external dimensions accurately","To remove tight lug nuts rapidly","To measure small clearance gaps","To measure voltage"],answer:1},{id:4,cat:"TOOLS",q:"'Impact Wrench' power source?",img:"impact_wrench.jpg",options:["Manual","Compressed air","Battery only","Hydraulic","Engine"],answer:1},{id:5,cat:"TOOLS",q:"'Feeler Gauge' measures:",img:"feeler_gauge.jpg",options:["Oil pressure","Small clearance gaps like valve clearances","Resistance","Tire pressure","Coolant temp"],answer:1},{id:6,cat:"ENGINE",q:"'Piston' function?",img:"piston.jpg",options:["Transfers force from combustion to connecting rod","Converts linear to rotary","Controls valves timing","Stores energy","Circulates oil"],answer:0},{id:7,cat:"ENGINE",q:"'Crankshaft' converts:",img:"crankshaft.jpg",options:["Rotary to linear","Electrical to mechanical","Linear piston into rotary","Heat into electrical","Fuel into air"],answer:2},{id:8,cat:"ENGINE",q:"Controls valves timing?",img:"camshaft.jpg",options:["Piston","Flywheel","Camshaft","Oil Pump","Radiator"],answer:2},{id:9,cat:"ENGINE",q:"'Timing Belt' synchronizes:",img:"timing_belt_chain.jpg",options:["Battery and alternator","Crankshaft and camshaft","Brake pad and rotor","Piston and battery","Radiator and thermostat"],answer:1},{id:10,cat:"ENGINE",q:"Turbocharger does?",img:"turbo.jpg",options:["Cools coolant","Forces extra compressed air for more power","Generates electricity","Stores energy","Regulates flow"],answer:1},{id:11,cat:"BRAKE",q:"'Brake Pad' friction against:",img:"brake_pad_cakram.jpg",options:["Brake Rotor","Battery","Piston","Radiator","Flywheel"],answer:0},{id:12,cat:"BRAKE",q:"'Drum Brake' uses:",img:"brake-drum.jpg",options:["External pads inward","Internal shoes outward against drum","Air pressure","Magnetic","Electrical"],answer:1},{id:13,cat:"BRAKE",q:"Master Cylinder function?",img:"master_cylinderr.jpg",options:["Converts foot pressure into hydraulic pressure","Prevents lockup","Supports weight","Generates electricity","Cools fluid"],answer:0},{id:14,cat:"BRAKE",q:"ABS prevents:",img:"abs_module.jpg",options:["Overheating","Wheel lockup during hard braking","Discharge","Leakage","Puncture"],answer:1},{id:15,cat:"BRAKE",q:"Brake Caliper houses:",img:"brake_caliper.jpg",options:["Oil and pistons","Brake pads and hydraulic pistons","Fuel and injectors","Coolant","Battery"],answer:1},{id:16,cat:"CHASSIS",q:"Shock Absorber function:",img:"shock.jpg",options:["Dampens suspension bounce","Transfers torque","Generates electricity","Ignites fuel","Converts pressure"],answer:0},{id:17,cat:"CHASSIS",q:"Leaf Spring used in:",img:"leaf_spring.jpg",options:["Sports cars only","Commercial trucks / heavy-duty","Motorcycles only","Electrical","Brake"],answer:1},{id:18,cat:"CHASSIS",q:"Tie Rod End transfers to:",img:"tierodend.jpg",options:["Brake pads","Steering knuckles","Pistons","Battery","Radiator"],answer:1},{id:19,cat:"CHASSIS",q:"Differential allows:",img:"differential.jpg",options:["Outer wheel faster than inner during turns","Engine stop","Battery charge faster","Brakes lock","Fuel inject more"],answer:0},{id:20,cat:"CHASSIS",q:"Clutch Plate between:",img:"Clutch_plate.jpg",options:["Battery and alternator","Engine and gearbox","Radiator and thermostat","Pad and rotor","Piston and plug"],answer:1},{id:21,cat:"ELECTRICAL",q:"Battery provides?",img:"battery.jpg",options:["Electrical current to starter","Hydraulic pressure","Compressed air","Oil","Coolant"],answer:0},{id:22,cat:"ELECTRICAL",q:"Alternator generates while:",img:"alternatore.jpg",options:["Engine off","Engine runs to recharge battery","Braking","Parked","Fuel empty"],answer:1},{id:23,cat:"ELECTRICAL",q:"Spark Plug ignites:",img:"spark_plug.jpg",options:["Oil","Compressed air-fuel mixture","Brake fluid","Coolant","Battery acid"],answer:1},{id:24,cat:"ELECTRICAL",q:"ECU controls:",img:"ECU.jpg",options:["Engine Control Unit - fuel injection and ignition","Charging Unit","Emergency Unit","Exhaust Unit","Cooling Unit"],answer:0},{id:25,cat:"ELECTRICAL",q:"Fuel Injector sprays:",img:"injector.jpg",options:["Water","Atomized fuel into cylinder","Oil into brake","Air into battery","Coolant into piston"],answer:1},{id:26,cat:"BODY",q:"Hood is:",img:"hood.jpg",options:["Hinged cover over engine","Rear lights","Mirror","Panel framing wheel","Opening for radiator"],answer:0},{id:27,cat:"BODY",q:"Fender function:",img:"fender.jpg",options:["Framing wheel well to block debris","Generates electricity","Stores energy","Ignites fuel","Regulates flow"],answer:0},{id:28,cat:"BODY",q:"Windshield shields from:",img:"windshielde.jpg",options:["Wind and airborne objects","Engine heat only","Acid","Exhaust only","Tire noise only"],answer:0},{id:29,cat:"BODY",q:"Grille allows:",img:"grille.jpg",options:["Air to reach radiator","Fuel to reach engine","Oil to circulate","Fluid to flow","Battery to charge"],answer:0},{id:30,cat:"BODY",q:"Bumper designed to:",img:"bumper.jpg",options:["Absorb low-speed impact","Generate electricity","Cool engine","Measure dimensions","Store fuel"],answer:0},];
const essayData=[{id:1,q:"Explain function of Torque Wrench and why important in engine assembly. (Min 30 words, English)"},{id:2,q:"Describe difference between Brake Pad and Drum Brake. (Min 30 words)"},{id:3,q:"What is function of Crankshaft and Camshaft? How work together? (Min 40 words)"},{id:4,q:"Explain how Battery, Alternator, Starter work together. (Min 40 words)"},{id:5,q:"Choose 3 tools from handbook and explain when use them during servicing. (Min 50 words)"},];
function zoomImg(src){document.getElementById('zoomedImg').src=src;document.getElementById('imgZoom').classList.remove('hidden');}
function startSecureExam(){const n=document.getElementById('fsName').value.trim();const c=document.getElementById('fsClass').value.trim();const a=document.getElementById('fsAbsen').value.trim();if(!n||!c){alert('Isi Nama dan Kelas!');return;}studentInfo={name:n,cls:c,absen:a};document.getElementById('fsPrompt').classList.add('hidden');document.getElementById('examId').innerText=n.substring(0,3).toUpperCase()+a+'-'+Math.random().toString(36).substring(2,6).toUpperCase();const wm=document.getElementById('watermark');let h='';for(let i=0;i<30;i++)h+=`<span>${n} - ${c}</span>`;wm.innerHTML=h;document.documentElement.requestFullscreen?.();examStarted=true;renderExam();startTimer();}
function addViolation(m){if(!examStarted)return;violations++;document.getElementById('violationCount').innerText=`VIOLATIONS: ${violations}/3`;document.getElementById('overlayTitle').innerText=`CHEATING! (${violations}/3)`;document.getElementById('overlayMsg').innerText=m;document.getElementById('secureOverlay').classList.remove('hidden');if(violations>=3)setTimeout(()=>submitExam(true),1500);}
function resumeExam(){document.getElementById('secureOverlay').classList.add('hidden');document.documentElement.requestFullscreen?.();}
document.addEventListener('contextmenu',e=>{e.preventDefault();addViolation('Right Click');return false;});
document.addEventListener('visibilitychange',()=>{if(examStarted&&document.hidden)addViolation('Tab Switch');});
window.addEventListener('blur',()=>{if(examStarted)addViolation('Blur');});
function renderExam(){document.getElementById('pgContainer').innerHTML=examData.map((item,idx)=>`<div class="bg-zinc-900 border border-zinc-800 rounded-xl p-4"><div class="flex justify-between mb-3"><span class="text-[9px] font-black px-2 py-1 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">${item.cat} - Q${item.id}</span><span class="text-[9px] text-zinc-500">KLIK GAMBAR ZOOM</span></div><div class="flex flex-col sm:flex-row gap-4 mb-4"><img src="${CDN+item.img}" onclick="zoomImg(this.src)" class="w-40 h-40 object-contain bg-white rounded-xl p-2 flex-shrink-0 cursor-zoom-in border-2 border-emerald-500/30 hover:border-emerald-500 hover:scale-105 transition-all mx-auto sm:mx-0"><p class="text-[15px] font-semibold leading-snug flex-1">${idx+1}. ${item.q}</p></div><div class="space-y-2">${item.options.map((opt,oIdx)=>`<label class="option-card flex items-start gap-3 p-3 rounded-lg border-2 border-zinc-700 bg-black cursor-pointer"><input type="radio" name="q${item.id}" value="${oIdx}" class="mt-1 accent-emerald-500" onchange="updateProgress()"><span class="text-[11px] font-black bg-zinc-800 w-6 h-6 flex items-center justify-center rounded-full">${String.fromCharCode(65+oIdx)}</span><span class="text-sm">${opt}</span></label>`).join('')}</div></div>`).join('');document.getElementById('essayContainer').innerHTML=essayData.map(item=>`<div class="bg-black border border-zinc-800 rounded-xl p-4"><p class="text-sm font-semibold mb-3"><span class="bg-emerald-500 text-black text-[10px] px-2 py-1 rounded font-black mr-2">ESSAY ${item.id}</span>${item.q}</p><textarea name="essay${item.id}" rows="4" placeholder="Type in English..." class="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-3 text-xs focus:border-emerald-500 outline-none" oninput="updateProgress()"></textarea></div>`).join('');}
function updateProgress(){let a=0;for(let i=1;i<=30;i++)if(document.querySelector(`input[name="q${i}"]:checked`))a++;for(let i=1;i<=5;i++){const ta=document.querySelector(`textarea[name="essay${i}"]`);if(ta&&ta.value.trim().length>10)a++;}document.getElementById('progressText').innerText=`${a}/35`;document.getElementById('progressBar').style.width=(a/35*100)+'%';}
async function submitExam(isForced=false){if(!isForced&&!confirm('Yakin submit?'))return;let pgScore=0;let details=[];for(let i=1;i<=30;i++){const sel=document.querySelector(`input[name="q${i}"]:checked`);const cor=examData[i-1].answer;if(sel){const v=parseInt(sel.value);if(v===cor)pgScore++;details.push({q:i,sel:v,cor:cor,ok:v===cor});}else details.push({q:i,sel:null,cor:cor,ok:false});}const essays=[];for(let i=1;i<=5;i++)essays.push(document.querySelector(`textarea[name="essay${i}"]`).value.trim());const percent=Math.round(pgScore/30*100);document.getElementById('finalResult').innerHTML=`<p class="text-sm"><b>${studentInfo.name}</b> | ${studentInfo.cls} | PG: ${pgScore}/30 (${percent}%) | Viol: ${violations}</p>`;document.getElementById('resultModal').classList.remove('hidden');if(document.exitFullscreen)document.exitFullscreen();examStarted=false;document.getElementById('sheetStatus').innerText='Mengirim ke Supabase (retry 5x)...';for(let attempt=1;attempt<=5;attempt++){try{const {error}=await supabaseClient.from('ujian_tkr').insert([{name:studentInfo.name,class:studentInfo.cls,absen:studentInfo.absen,pg_score:pgScore,percent:percent,violations:violations,exam_id:document.getElementById('examId').innerText,answers:details,essays:essays}]);if(!error){document.getElementById('sheetStatus').innerHTML=`<span class="text-green-400 font-black">✓ BERHASIL MASUK SUPABASE (try ${attempt})</span>`;break;}else throw error;}catch(e){if(attempt<5){document.getElementById('sheetStatus').innerText=`Antri, retry ${attempt}/5...`;await new Promise(r=>setTimeout(r,1200*attempt+Math.random()*800));}else{document.getElementById('sheetStatus').innerHTML=`<span class="text-red-400">Gagal: ${e.message}</span>`;}}}}
let timeLeft=45*60;function startTimer(){setInterval(()=>{if(!examStarted)return;timeLeft--;if(timeLeft<=0){submitExam(true);return;}const m=Math.floor(timeLeft/60);const s=timeLeft%60;document.getElementById('timer').innerText=`${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;},1000);}
</script>
</body>
</html>
